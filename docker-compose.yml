# Transcriptor: transcrição de áudio e vídeo com Whisper (faster-whisper) na GPU.
# Guia: README.md.
#
#   api      interface web e API; login pelo Authentik (OIDC). Única porta
#            publicada (WEB_PORT, 8080 por padrão): ponha um proxy com HTTPS
#            na frente.
#   worker   GPU NVIDIA: pega os jobs da fila no Postgres. Sem porta e sem
#            internet direta: sai só pelo proxy `egress`.
#   egress   proxy de saída (smokescreen): recusa destinos em redes privadas,
#            então um link não alcança a rede local nem outros containers.
#   db       Postgres: usuários, fila, transcrições.
#
# Dados (padrão ./data, ajuste no .env): banco em
# ${APPDATA_PATH}/transcriptor/postgres (faça backup); modelos e arquivos
# temporários em ${CACHE_PATH}/transcriptor (recriáveis).

x-env: &env
  TZ: ${TZ:-UTC}
  TRANSCRIPTOR_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  TRANSCRIPTOR_MAX_UPLOAD_MB: ${TRANSCRIPTOR_MAX_UPLOAD_MB:-2048}
  TRANSCRIPTOR_MAX_DURATION_MINUTES: ${TRANSCRIPTOR_MAX_DURATION_MINUTES:-240}
  TRANSCRIPTOR_RETENTION_DAYS: ${TRANSCRIPTOR_RETENTION_DAYS:-180}
  TRANSCRIPTOR_AUDIO_DAYS: ${TRANSCRIPTOR_AUDIO_DAYS:-7}
  TRANSCRIPTOR_MODELS: ${TRANSCRIPTOR_MODELS:-small,turbo,large-v3}
  TRANSCRIPTOR_DEFAULT_MODEL: ${TRANSCRIPTOR_DEFAULT_MODEL:-turbo}

services:
  db:
    image: postgres:16-alpine
    container_name: transcriptor-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-UTC}
    volumes:
      - ${APPDATA_PATH:-./data}/transcriptor/postgres:/var/lib/postgresql/data
    networks:
      - transcriptor-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  migrate:
    image: ghcr.io/amacneil/dbmate:2
    container_name: transcriptor-migrate
    restart: "no"
    volumes:
      - ./db/migrations:/db/migrations:ro
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
    command: --migrations-dir /db/migrations --no-dump-schema up
    networks:
      - transcriptor-internal
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: transcriptor-api
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    mem_limit: 512m
    environment:
      <<: *env
      HOME: /tmp
      # Endereço público, sem barra no fim (o login volta para <ele>/auth/callback).
      TRANSCRIPTOR_PUBLIC_URL: ${TRANSCRIPTOR_PUBLIC_URL:-http://localhost:8080}
      TRANSCRIPTOR_OIDC_ISSUER: ${TRANSCRIPTOR_OIDC_ISSUER}
      TRANSCRIPTOR_SSO_CLIENT_ID: ${TRANSCRIPTOR_SSO_CLIENT_ID}
      TRANSCRIPTOR_SSO_CLIENT_SECRET: ${TRANSCRIPTOR_SSO_CLIENT_SECRET}
      # Opcional: endereço interno do Authentik, se a API alcançar o container
      # dele numa rede Docker em comum (vazio = pelo endereço público).
      TRANSCRIPTOR_OIDC_INTERNAL_URL: ${TRANSCRIPTOR_OIDC_INTERNAL_URL:-}
      TRANSCRIPTOR_USERS_GROUP: ${TRANSCRIPTOR_USERS_GROUP:-transcriptor_users}
      TRANSCRIPTOR_ADMINS_GROUP: ${TRANSCRIPTOR_ADMINS_GROUP:-transcriptor_admins}
    volumes:
      # Uploads (o worker lê daqui) e o áudio para ouvir junto com o texto.
      - ${CACHE_PATH:-./data/cache}/transcriptor/work:/work
    ports:
      - "${WEB_PORT:-8080}:8000"
    networks:
      - transcriptor-internal
      # Porta publicada (uma rede interna não publica portas) e o Authentik
      # pelo endereço público. Com o Authentik numa rede Docker em comum
      # (TRANSCRIPTOR_OIDC_INTERNAL_URL), a API pode ficar sem internet.
      - transcriptor-egress
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: transcriptor-worker
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,nosuid,size=256m
    # Um áudio de 4 h ocupa ~1 GB na memória durante a transcrição.
    mem_limit: 6g
    memswap_limit: 6g
    stop_grace_period: 30s
    environment:
      <<: *env
      TRANSCRIPTOR_WORKER_NAME: gpu
      TRANSCRIPTOR_IDLE_UNLOAD_MINUTES: ${TRANSCRIPTOR_IDLE_UNLOAD_MINUTES:-5}
      TRANSCRIPTOR_EGRESS_PROXY: http://transcriptor-egress:4750
      HTTP_PROXY: http://transcriptor-egress:4750
      HTTPS_PROXY: http://transcriptor-egress:4750
      NO_PROXY: db,localhost,127.0.0.1
      HOME: /tmp
      HF_HOME: /models/.huggingface
      DENO_DIR: /tmp/deno
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ${CACHE_PATH:-./data/cache}/transcriptor/work:/work
      # Modelos do catálogo (app/catalog.py), baixados e conferidos pelo worker.
      - ${CACHE_PATH:-./data/cache}/transcriptor/models:/models
    networks:
      # Só a rede interna: o banco e o proxy de saída. Nada mais.
      - transcriptor-internal
    depends_on:
      migrate:
        condition: service_completed_successfully
      egress:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  egress:
    build:
      context: egress
    container_name: transcriptor-egress
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    networks:
      - transcriptor-internal
      - transcriptor-egress

networks:
  # Banco, worker e proxy. Sem saída para a internet.
  transcriptor-internal:
    name: transcriptor-internal
    internal: true
  # Saída para a internet: o proxy do worker e a API (porta e login).
  transcriptor-egress:
    name: transcriptor-egress
